name: Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_trivy:
        description: "skip the Trivy gate (EMERGENCY, logged)"
        type: boolean
        default: false

env:
  REGISTRY: git.rfa.cz
  IMAGE_NAME: tth/birdnet-go

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Secrets in the commits of this push (gitleaks, first-parent only,
      # redacted output) and misconfigurations in Dockerfiles/compose
      # (trivy config, report only).
      - name: gitleaks
        uses: https://git.rfa.cz/tth-pub/ci-actions/gitleaks@v11
        with:
          mode: block

      - name: Trivy config
        uses: https://git.rfa.cz/tth-pub/ci-actions/trivy-gate@v11
        with:
          scan-type: fs
          scanners: misconfig
          mode: warn

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        id: build
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
          echo "short_sha=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

          # Build version from git
          BUILD_VERSION="$(git describe --tags --always 2>/dev/null || echo "sha-${SHORT_SHA}")"

          # Layer cache from the registry, not only from the runner: builds
          # alternate between grg-runner and swarm-runner and the swarm prunes
          # build cache, so runtime-base was often rebuilt. Its apt/dpkg RUN
          # is not reproducible, so every rebuild pushed a new 217 MB layer
          # and invalidated all of `final` (the 67 MB models layer too) -
          # ~0.5 GB of new blobs per build, ~14 GB held by the keep-30
          # cleanup rule (proxmox.rfa.cz TODO-125, measured 2026-11-03).
          # Inline cache = the metadata rides in the image itself, no extra
          # blobs (unlike a mode=max :buildcache, which would also store the
          # buildenv/node_modules layers). `latest` is the last image that
          # passed the gate. A missing/unreadable cache source only logs
          # "failed to configure registry cache importer" and builds
          # normally - tested 2026-11-03 against a local registry with an
          # empty-cache containerd-store daemon.
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ gitea.actor }} --password-stdin

          build() {
            docker build --pull \
              --cache-from type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              --cache-to type=inline \
              --build-arg BUILD_VERSION="${BUILD_VERSION}" \
              --platform linux/amd64 \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA} \
              "$@" .
          }
          upgradable() {
            docker run --rm --user 0 --entrypoint sh \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA} \
              -c 'apt-get update -qq >/dev/null 2>&1 && apt list --upgradable 2>/dev/null | grep -c "\[upgradable" || true'
          }

          build
          # A cached runtime-base never sees Debian (security) updates: the
          # runner's local cache wins over the registry, and on 2026-11-02
          # swarm-runner reused an apt layer older than vim +deb13u1 -> Trivy
          # gate blocked 72 findings while `latest` (grg-runner) was fine.
          # The gate only reports; this fixes it: if the built image has
          # upgradable packages (or the check fails), rebuild runtime-base
          # without cache. Costs one rebuild per Debian update per runner.
          UPG=$(upgradable || true)
          if [ "$UPG" != "0" ]; then
            echo "::warning::cached runtime-base is stale (${UPG:-check failed} upgradable packages), rebuilding it without cache"
            build --no-cache-filter runtime-base
            echo "after rebuild: $(upgradable || true) upgradable packages"
          else
            echo "runtime-base is current (0 upgradable packages)"
          fi

      - name: Push to registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ gitea.actor }} --password-stdin
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.build.outputs.short_sha }}

      # Trivy gate (tth-pub/ci-actions): a fixable HIGH/CRITICAL or a secret
      # in the image = `latest` does not move and nothing is deployed.
      # Accepted risks with a reason and expiry in .trivyignore.yaml.
      # mode: block since 2026-10-26 (phase 2).
      - name: Trivy gate
        id: trivy
        uses: https://git.rfa.cz/tth-pub/ci-actions/trivy-gate@v11
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.build.outputs.short_sha }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
          mode: block
          skip: ${{ inputs.skip_trivy && 'true' || 'false' }}

      - name: Move latest
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ gitea.actor }} --password-stdin
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # SBOM of the deployed image to Dependency-Track from the same scan;
      # a DT outage (or a missing key) does not stop the deploy.
      - name: SBOM to Dependency-Track
        uses: https://git.rfa.cz/tth-pub/ci-actions/dtrack-sbom@v11
        with:
          report: ${{ steps.trivy.outputs.report }}
          url: https://dtrack.grg
          api-key: ${{ secrets.DTRACK_API_KEY }}
          ca-pem: ${{ vars.RFA_CA_PEM }}
          project: birdnet-go
          version: latest

      # Compose in git = source of truth; stack env (SENTRY_DSN) is kept,
      # IMAGE_TAG pins the commit that passed the gate.
      - name: Deploy to Portainer
        uses: https://git.rfa.cz/tth-pub/ci-actions/portainer-deploy@v11
        with:
          url: ${{ secrets.PORTAINER_URL }}
          token: ${{ secrets.PORTAINER_TOKEN }}
          stack-id: ${{ secrets.PORTAINER_STACK_ID }}
          compose-file: docker-compose.swarm.yml
          vars: |
            IMAGE_TAG=${{ steps.build.outputs.short_sha }}
          smoke-url: https://birds.rfa.cz/health
          smoke-timeout: "300"

      - name: Smoke test
        run: |
          HEALTH=$(curl -sf --insecure "https://birds.rfa.cz/health" 2>/dev/null || echo "{}")
          echo "Health: ${HEALTH}"
          if echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('status')=='healthy'" 2>/dev/null; then
            echo "Health check passed"
          else
            echo "Health check failed or degraded"
            exit 1
          fi

      # No registry cleanup step here (removed 2026-10-27): it deleted every
      # version except latest/sha-*, including the sha256:* child manifests
      # (image + buildx attestation) that each tag's OCI index points to, so
      # every tag in the registry became unpullable and the service ran only
      # from node caches. Old versions are removed by the owner-level Gitea
      # package cleanup rule (tth -> Settings -> Packages), which keeps digest
      # versions still referenced by a manifest. proxmox.rfa.cz TODO-126.
