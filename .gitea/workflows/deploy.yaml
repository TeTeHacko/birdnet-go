name: Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_trivy:
        description: "skip the Trivy gate (EMERGENCY, logged)"
        type: boolean
        default: false

env:
  REGISTRY: git.rfa.cz
  IMAGE_NAME: tth/birdnet-go

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Secrets in the commits of this push (gitleaks, first-parent only,
      # redacted output) and misconfigurations in Dockerfiles/compose
      # (trivy config, report only).
      - name: gitleaks
        uses: https://git.rfa.cz/tth-pub/ci-actions/gitleaks@v8
        with:
          mode: block

      - name: Trivy config
        uses: https://git.rfa.cz/tth-pub/ci-actions/trivy-gate@v8
        with:
          scan-type: fs
          scanners: misconfig
          mode: warn

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        id: build
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
          echo "short_sha=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

          # Build version from git
          BUILD_VERSION="$(git describe --tags --always 2>/dev/null || echo "sha-${SHORT_SHA}")"

          docker build --pull \
            --build-arg BUILD_VERSION="${BUILD_VERSION}" \
            --platform linux/amd64 \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA} \
            .

      - name: Push to registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ gitea.actor }} --password-stdin
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.build.outputs.short_sha }}

      # Trivy gate (tth-pub/ci-actions): a fixable HIGH/CRITICAL or a secret
      # in the image = `latest` does not move and nothing is deployed.
      # Accepted risks with a reason and expiry in .trivyignore.yaml.
      # mode: block since 2026-10-26 (phase 2).
      - name: Trivy gate
        id: trivy
        uses: https://git.rfa.cz/tth-pub/ci-actions/trivy-gate@v8
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.build.outputs.short_sha }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
          mode: block
          skip: ${{ inputs.skip_trivy && 'true' || 'false' }}

      - name: Move latest
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ gitea.actor }} --password-stdin
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # SBOM of the deployed image to Dependency-Track from the same scan;
      # a DT outage (or a missing key) does not stop the deploy.
      - name: SBOM to Dependency-Track
        uses: https://git.rfa.cz/tth-pub/ci-actions/dtrack-sbom@v8
        with:
          report: ${{ steps.trivy.outputs.report }}
          url: https://dtrack.grg
          api-key: ${{ secrets.DTRACK_API_KEY }}
          ca-pem: ${{ vars.RFA_CA_PEM }}
          project: birdnet-go
          version: latest

      # Compose in git = source of truth; stack env (SENTRY_DSN) is kept,
      # IMAGE_TAG pins the commit that passed the gate.
      - name: Deploy to Portainer
        uses: https://git.rfa.cz/tth-pub/ci-actions/portainer-deploy@v8
        with:
          url: ${{ secrets.PORTAINER_URL }}
          token: ${{ secrets.PORTAINER_TOKEN }}
          stack-id: ${{ secrets.PORTAINER_STACK_ID }}
          compose-file: docker-compose.swarm.yml
          vars: |
            IMAGE_TAG=${{ steps.build.outputs.short_sha }}
          smoke-url: https://birds.rfa.cz/health
          smoke-timeout: "300"

      - name: Smoke test
        run: |
          HEALTH=$(curl -sf --insecure "https://birds.rfa.cz/health" 2>/dev/null || echo "{}")
          echo "Health: ${HEALTH}"
          if echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('status')=='healthy'" 2>/dev/null; then
            echo "Health check passed"
          else
            echo "Health check failed or degraded"
            exit 1
          fi

      - name: Cleanup old container images
        # Keeps the N most recent sha-* tags plus `latest` and the currently
        # deployed tag, deletes the rest from the Gitea Packages registry to
        # stop the registry disk filling up. Runs after a successful deploy so
        # we never delete an image we just promoted.
        env:
          # AUTO_SYNC_TOKEN is a Gitea PAT with admin/write:package scope.
          # REGISTRY_TOKEN works for docker login but is not guaranteed to
          # carry the API scope needed for DELETE /api/v1/packages/...
          GITEA_TOKEN: ${{ secrets.AUTO_SYNC_TOKEN }}
          GITEA_URL: ${{ env.REGISTRY }}
          KEEP_COUNT: '10'
          CURRENT_TAG: ${{ steps.build.outputs.short_sha }}
        run: |
          set -euo pipefail

          # List all birdnet-go container package versions, sorted newest-first
          ALL_VERSIONS=$(curl -sk -H "Authorization: token ${GITEA_TOKEN}" \
            "https://${GITEA_URL}/api/v1/packages/tth?type=container&q=birdnet-go&limit=100")

          # Build the keep-set: `latest`, the just-deployed tag, plus KEEP_COUNT
          # most-recent sha-* tags. Anything else with name=birdnet-go is deleted.
          KEEP_LIST=$(echo "${ALL_VERSIONS}" | python3 -c "
          import sys, json, os
          pkgs = [p for p in json.load(sys.stdin) if p.get('name') == 'birdnet-go']
          # newest first
          pkgs.sort(key=lambda p: p.get('created_at',''), reverse=True)
          keep = {'latest', os.environ['CURRENT_TAG']}
          sha_kept = 0
          for p in pkgs:
              v = p.get('version','')
              if v.startswith('sha-') and sha_kept < int(os.environ['KEEP_COUNT']):
                  keep.add(v); sha_kept += 1
          # delete = everything not in keep
          delete = [p['version'] for p in pkgs if p.get('version') not in keep]
          print('\n'.join(delete))
          " | tr '\n' ' ')

          if [ -z "${KEEP_LIST}" ]; then
            echo "Nothing to delete (≤${KEEP_COUNT} sha-* versions in registry)"
            exit 0
          fi

          echo "Will delete: ${KEEP_LIST}"
          for VERSION in ${KEEP_LIST}; do
            HTTP=$(curl -sk -o /dev/null -w '%{http_code}' \
              -X DELETE -H "Authorization: token ${GITEA_TOKEN}" \
              "https://${GITEA_URL}/api/v1/packages/tth/container/birdnet-go/${VERSION}")
            if [ "${HTTP}" = "204" ] || [ "${HTTP}" = "200" ]; then
              echo "  ✓ deleted ${VERSION}"
            else
              echo "  ⚠ failed to delete ${VERSION} (HTTP ${HTTP})"
            fi
          done
